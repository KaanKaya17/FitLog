name: Android CI

on:
  push:
    branches: [ master ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Gerçek anahtarlar repoda yok. CI yalnızca derleme/test için sahte değerler
      # kullanır; google-services.json yoksa Gradle yer tutucuyu kendisi üretir.
      - name: Create placeholder config
        run: |
          echo "SUPABASE_URL=https://example.supabase.co" > local.properties
          echo "SUPABASE_API_KEY=ci-placeholder" >> local.properties

      - name: Unit tests, lint and build
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7
